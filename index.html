<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My English Narrative Blog</title>
  <style>
        body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      background: #fdfcfb;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.7;
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    section {
      background: white;
      padding: 2rem;
      margin-bottom: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    section h2 {
      margin-top: 0;
      color: #444;
      border-bottom: 2px solid #eee;
      padding-bottom: 0.5rem;
    }

    /* --------- Comment Section --------- */
    #comments {
      margin-top: 2rem;
    }

    #comments h3 {
      margin-bottom: 0.5rem;
    }

    #commentForm textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }

    #commentForm button {
      background: #66a6ff;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #commentForm button:hover {
      background: #4a90e2;
    }

    .comment {
      background: #f0f7ff;
      padding: 0.7rem;
      border-radius: 8px;
      margin-top: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
      background: #f3f3f3;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My English Portifolio</h1>
    <h1>By Cyrus Jacob 10B2</h1>
    <nav>
      <a href="#first-draft">First Draft</a>
      <a href="#final-draft">Final Draft</a>
      <a href="#comments">Comments</a>
    </nav>
  </header>

  <main>
    <section id="first-draft">
      <h2>First Draft</h2>
      <p>[Your first draft goes here...]</p>
    </section>

    <section id="final-draft">
      <h2>Final Draft</h2>
      <p>[Your final draft goes here...]</p>
    </section>

    <section id="comments">
      <h3>&nbsp;</h3>
		<h3>Leave a Comment</h3>
      <form id="commentForm">
        <textarea placeholder="Write your comment here..." cols="20" name="S1" rows="1"></textarea><br>
        <button type="submit">Post Comment</button>
      </form>
      <div id="commentList"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 My English Narrative Blog</p>
  </footer>

  <script>
    // Simple Comment System
    const form = document.getElementById('commentForm');
    const commentList = document.getElementById('commentList');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const textarea = form.querySelector('textarea');
      const commentText = textarea.value.trim();
      if(commentText !== "") {
        const newComment = document.createElement('div');
        newComment.classList.add('comment');
        newComment.textContent = commentText;
        commentList.appendChild(newComment);
        textarea.value = "";
      }
    });
  </script>
</body>
</html>
